<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
 
</script>
</head>
<body>
    
    <div>
       <h1><span>Registration Form</span></h1> 
       <form id="form">
           <span class="a1">
             <label for="firstname">First Name:</label>
       <input type="text" id="firstname" name="firstname" placeholder="Enter your first name">
           </span>
           <span class="a2">
                 <label for="lastname">Last Name:</label>
                 <input type="text" id="lastname" name="lastname" placeholder="Enter your Last Name">

           </span>
           <span class="a3">
             <label for="email">Email:</label>
                 <input type="email" id="email" name="email" placeholder="Enter your Email">
           </span>
           <span class="a4">
                 <label for="password">Password:</label>
                 <input type="password" id="password" name="password" placeholder="Enter your Password">
                 
           </span>
       <span class="a5">
         <label for="retype">Re-Type Password:</label>
                 <input type="password" id="retype" name="retype" placeholder="Re-Type Password">
                
       </span>
       <span class="a8">
         <label for="contact">Contact:</label>
          <input type="text" id="contact" name="contact"placeholder="Enter your contact">
       </span>
     <span class="a9">
         <label for="gender">Gender:</label>
          <input type="text" id="gender" name="gender"placeholder="Enter your gendar">
       </span>
       
       <nav class="a10">
       
      <button type="submit" id="submitbutton">submit</button> 
        </nav>
        </form>
    </div>
     <script src="script.js"></script>
</body>
</html>
