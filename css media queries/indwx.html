<head>

    <title>Document</title>
    <style>
        body{
            background-color: rgb(230, 8, 8);
        }
        @media only screen and (max-width:455px){

            }
            .boxes{
                flex-direction: column;
            }

         @media only screen and(orientation:portrait ){

            width: 344px;
            height: 344px;
            background-color: steelblue;
            padding: 3px;
            margin: 3px;
        }
        .boxes{
            display: flex;
        }
    </style>
</head>
<body>
