<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            border: 2px solid black;
            padding: 34px;
            box-shadow: 5px 15px 5px gray;
            margin: auto;
            width: 40vh;
            border-radius: 47px;

            margin-bottom: 4em;
        }
        .text-sadow{
           text-shadow: 2px 2px 5px rgb(9, 118, 172);
           outline: 2px solid rgb(27, 18, 18);
           outline-offset: 47px;

        }
    </style>
</head>

<body>
    <div class="box">
        i am a box

    </div>
    <p class="text-sadow">
        Lorem ipsum dolor, sit amet consectetur adipisicing elit. Possimus ullam ea laborum, consectetur molestias et?
        Temporibus suscipit tempore numquam, excepturi sed deleniti sequi iure. Dolor magni suscipit aut quae minima.
    </p>
</body>

</html>
